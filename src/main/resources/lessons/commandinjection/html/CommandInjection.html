<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Intro.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Concepts.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Task1.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
            <form class="attack-form" accept-charset="UNKNOWN"
                  method="POST" name="form"
                  th:action="@{/CommandInjection/ping}">
                <table>
                    <tr>
                        <td>IP address:</td>
                        <td><input name="ipAddress" value="127.0.0.1" type="TEXT" size="50"/></td>
                        <td><input name="submit" value="Ping" type="SUBMIT"/></td>
                    </tr>
                </table>
            </form>
            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Task2.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
            <form class="attack-form" accept-charset="UNKNOWN"
                  method="POST" name="form"
                  th:action="@{/CommandInjection/dns-lookup}">
                <table>
                    <tr>
                        <td>Hostname:</td>
                        <td><input name="hostname" value="webgoat.org" type="TEXT" size="50"/></td>
                        <td><input name="submit" value="Lookup" type="SUBMIT"/></td>
                    </tr>
                </table>
            </form>
            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/commandinjection/documentation/CommandInjection_Prevention.adoc}"></div>
    </div>

</html>
