command-injection.title=Command Injection

command-injection.success=Well done! You successfully injected an OS command and read the flag.
command-injection.keep-trying=The flag was not found in the output — try injecting a command that reads the flag file.

command-injection.hints.task1.1=Open your browser developer tools (Network tab) and inspect what is sent when you click Ping. Which parameter carries the IP address?
command-injection.hints.task1.2=Try appending a command separator to the IP address, for example: 127.0.0.1; whoami — do you see the output of both commands?
command-injection.hints.task1.3=Now replace "whoami" with a command that reads the flag file whose path is shown in the task description, e.g. 127.0.0.1; cat /path/to/flag.txt

command-injection.hints.task2.1=Submit a hostname and look at the response. Now try adding a semicolon (;) before a command — what happens to it?
command-injection.hints.task2.2=Semicolons are stripped, but what other characters separate commands in a Unix shell? Try | (pipe).
command-injection.hints.task2.3=Use the pipe operator to chain commands: webgoat.org | cat /path/to/flag.txt — the flag path is shown on the Task 1 page.
