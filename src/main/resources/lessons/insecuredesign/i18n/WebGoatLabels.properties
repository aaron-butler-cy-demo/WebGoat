insecure-design.title=Insecure Design

insecure-design.task1.success=Order confirmed: {0} for ${1,number,0.00}. You successfully manipulated the price to {1,number,0.00} — the server trusted a client-supplied value it should have looked up itself.
insecure-design.task1.failed=Order placed: {0} for ${1,number,0.00}. The server accepted your submitted price. Try changing the price field to 0 or a negative value.

insecure-design.task2.success=Order confirmed: {0} × WebGoat Stickers (total: ${1,number,0.00}). You exploited the missing quantity validation — negative quantities produce a negative (or zero) total.
insecure-design.task2.failed=Order placed: {0} × WebGoat Stickers (total: ${1,number,0.00}). The server accepted your quantity. Try changing it to a negative number.

insecure-design.hints.task1.1=Open your browser DevTools (F12) and go to the Network tab. Submit the form normally, then inspect the request payload — which parameter holds the price?
insecure-design.hints.task1.2=You can resend the request with a modified price directly from the DevTools Network panel ("Edit and Resend") or via an HTTP proxy such as Burp Suite or ZAP.
insecure-design.hints.task1.3=Set the price parameter to 0 or a negative value (e.g. -1) and resubmit. The server will process whatever value you send.

insecure-design.hints.task2.1=Submit the form with quantity=1 and inspect the request in DevTools. Only the quantity is sent — the price is computed on the server. What happens if quantity is not positive?
insecure-design.hints.task2.2=The server multiplies the unit price ($4.99) by your quantity. Think about what a negative quantity means mathematically.
insecure-design.hints.task2.3=Change the quantity field to -1 (or any negative integer) and submit. The server performs no bounds check, so it will process the order with a negative total.
