<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/insecuredesign/documentation/InsecureDesign_Intro.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/insecuredesign/documentation/InsecureDesign_Concepts.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/insecuredesign/documentation/InsecureDesign_Task1.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
            <form class="attack-form" accept-charset="UNKNOWN"
                  method="POST" name="form"
                  th:action="@{/InsecureDesign/task1}">
                <table>
                    <tr>
                        <td>Product:</td>
                        <td><input type="text" name="productName" value="WebGoat Widget" readonly="readonly"/></td>
                    </tr>
                    <tr>
                        <td>Price ($):</td>
                        <td><input type="text" name="price" value="29.99"/></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input name="submit" value="Place Order" type="SUBMIT"/></td>
                    </tr>
                </table>
            </form>
            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/insecuredesign/documentation/InsecureDesign_Task2.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>
            <form class="attack-form" accept-charset="UNKNOWN"
                  method="POST" name="form"
                  th:action="@{/InsecureDesign/task2}">
                <table>
                    <tr>
                        <td>WebGoat Stickers (unit price: $4.99)</td>
                    </tr>
                    <tr>
                        <td>Quantity:</td>
                        <td><input type="number" name="quantity" value="1"/></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input name="submit" value="Add to Cart" type="SUBMIT"/></td>
                    </tr>
                </table>
            </form>
            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/insecuredesign/documentation/InsecureDesign_Prevention.adoc}"></div>
    </div>

</html>
